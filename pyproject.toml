[project]
name = "niludetsu"
version = "2.1.3"
description = "Discord bot for nullther!"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.13.3",
    "deep-translator>=1.11.4",
    "discord-py>=2.7.0",
    "dnspython>=2.8.0",
    "fonttools>=4.61.1",
    "loguru>=0.7.3",
    "mcstatus>=12.2.1",
    "numpy>=2.4.2",
    "pendulum>=3.2.0",
    "pillow>=12.1.1",
    "psutil>=7.2.2",
    "pyfiglet>=1.0.4",
    "python-dotenv>=1.2.2",
    "python-whois>=0.9.6",
    "requests>=2.32.5",
    "selectolax>=0.4.6",
    "asyncpg>=0.31.0",
    "fastapi>=0.139.0",
    "uvicorn>=0.50.2",
    "pyjwt>=2.13.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "duckduckgo-search>=7.0.0",
    "pynacl>=1.5.0",
]

[tool.vercel]
entrypoint = "web.app:app"
