<!DOCTYPE html>
<html lang="uk" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}Niludetsu Dashboard{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          colors: {
            surface: { 0: '#06080f', 1: '#0c1021', 2: '#111631', 3: '#171d3d' },
            accent: { 300: '#a5b4fc', 400: '#818cf8', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca' },
          }
        }
      }
    }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    :root {
      --bg: #06080f;
      --glass: rgba(12, 16, 33, 0.65);
      --glass-border: rgba(99, 102, 241, 0.1);
      --glass-border-hover: rgba(99, 102, 241, 0.25);
      --glow: rgba(99, 102, 241, 0.2);
      --glow-strong: rgba(99, 102, 241, 0.4);
      --accent: #6366f1;
      --accent-light: #818cf8;
      --text: #e2e8f0;
      --text-muted: #64748b;
      --radius: 20px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 0%, rgba(99,102,241,0.08) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 80% 100%, rgba(139,92,246,0.06) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── Glass ─────────────────────────────── */
    .glass {
      background: var(--glass);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      transition: border-color 0.35s cubic-bezier(.4,0,.2,1),
                  box-shadow 0.35s cubic-bezier(.4,0,.2,1),
                  transform 0.35s cubic-bezier(.4,0,.2,1);
    }
    .glass:hover {
      border-color: var(--glass-border-hover);
    }

    /* ── Glow ──────────────────────────────── */
    .glow       { box-shadow: 0 0 30px -8px var(--glow), 0 4px 24px -4px rgba(0,0,0,0.5); }
    .glow-hover:hover { box-shadow: 0 0 40px -4px var(--glow-strong), 0 8px 32px -4px rgba(0,0,0,0.6); }
    .glow-strong { box-shadow: 0 0 60px -8px var(--glow-strong), 0 8px 40px -4px rgba(0,0,0,0.5); }

    /* ── Gradient accent ───────────────────── */
    .gradient-text {
      background: linear-gradient(135deg, var(--accent-light), #a78bfa, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .gradient-border {
      position: relative;
    }
    .gradient-border::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(135deg, rgba(99,102,241,0.4), rgba(168,85,247,0.3), rgba(99,102,241,0.1));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    /* ── Animations ────────────────────────── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes shimmer {
      0%   { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 20px -6px var(--glow); }
      50%      { box-shadow: 0 0 40px -4px var(--glow-strong); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-6px); }
    }

    .anim-fade-up {
      opacity: 0;
      animation: fadeUp 0.6s cubic-bezier(.4,0,.2,1) forwards;
    }
    .anim-delay-1 { animation-delay: 0.1s; }
    .anim-delay-2 { animation-delay: 0.2s; }
    .anim-delay-3 { animation-delay: 0.3s; }
    .anim-delay-4 { animation-delay: 0.4s; }
    .anim-delay-5 { animation-delay: 0.5s; }
    .anim-delay-6 { animation-delay: 0.6s; }

    /* ── Scrollbar ─────────────────────────── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(99,102,241,0.25); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(99,102,241,0.4); }

    /* ── Inputs ────────────────────────────── */
    .input-glass {
      background: rgba(6, 8, 15, 0.6);
      border: 1px solid rgba(99, 102, 241, 0.1);
      border-radius: 12px;
      padding: 12px 16px;
      color: #e2e8f0;
      font-size: 0.95rem;
      transition: all 0.25s cubic-bezier(.4,0,.2,1);
      outline: none;
      width: 100%;
    }
    .input-glass::placeholder { color: #475569; }
    .input-glass:focus {
      border-color: rgba(99, 102, 241, 0.4);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.08);
    }

    textarea.input-glass { resize: vertical; min-height: 80px; }

    /* ── Buttons ───────────────────────────── */
    .btn-accent {
      background: linear-gradient(135deg, var(--accent), var(--accent-light));
      color: #fff;
      font-weight: 600;
      padding: 12px 28px;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(.4,0,.2,1);
      position: relative;
      overflow: hidden;
    }
    .btn-accent::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.1), transparent);
      opacity: 0;
      transition: opacity 0.25s;
    }
    .btn-accent:hover::before { opacity: 1; }
    .btn-accent:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 30px -6px var(--glow-strong);
    }
    .btn-accent:active { transform: translateY(0); }

    .btn-ghost {
      background: rgba(99, 102, 241, 0.08);
      color: var(--accent-light);
      font-weight: 600;
      padding: 12px 28px;
      border-radius: 14px;
      border: 1px solid rgba(99, 102, 241, 0.15);
      cursor: pointer;
      transition: all 0.25s cubic-bezier(.4,0,.2,1);
    }
    .btn-ghost:hover {
      background: rgba(99, 102, 241, 0.15);
      border-color: rgba(99, 102, 241, 0.3);
    }

    /* ── Discord embed simulator ───────────── */
    .discord-msg {
      background: #313338;
      border-radius: 4px;
      padding: 16px 16px 16px 72px;
      position: relative;
      font-family: 'gg sans', 'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    }
    .discord-msg .avatar {
      position: absolute;
      left: 16px;
      top: 16px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
    }
    .discord-msg .avatar-placeholder {
      position: absolute;
      left: 16px;
      top: 16px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #5865f2;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 16px;
      color: #fff;
    }
    .discord-msg .meta {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 4px;
    }
    .discord-msg .bot-name {
      font-size: 1rem;
      font-weight: 600;
      color: #f2f3f5;
    }
    .discord-msg .bot-badge {
      background: #5865f2;
      color: #fff;
      font-size: 0.65rem;
      font-weight: 600;
      padding: 1px 5px;
      border-radius: 3px;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      line-height: 1.3;
    }
    .discord-msg .timestamp {
      font-size: 0.75rem;
      color: #949ba4;
      font-weight: 400;
    }
    .discord-embed {
      margin-top: 4px;
      max-width: 520px;
      background: #2b2d31;
      border-radius: 4px;
      border-left: 4px solid #6366f1;
      padding: 12px 16px 14px;
      overflow: hidden;
    }
    .discord-embed .embed-title {
      font-size: 1rem;
      font-weight: 700;
      color: #f2f3f5;
      margin-bottom: 6px;
      line-height: 1.3;
    }
    .discord-embed .embed-desc {
      font-size: 0.9rem;
      color: #dbdee1;
      line-height: 1.5;
      white-space: pre-wrap;
    }
    .discord-embed .embed-footer {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid rgba(255,255,255,0.06);
      font-size: 0.75rem;
      color: #949ba4;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .discord-embed .embed-footer-icon {
      width: 16px;
      height: 16px;
      border-radius: 50%;
    }

    /* ── Nav ────────────────────────────────── */
    .nav-glass {
      background: rgba(6, 8, 15, 0.75);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-bottom: 1px solid rgba(99, 102, 241, 0.08);
    }
    .nav-glass::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(99,102,241,0.3), transparent);
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body class="min-h-screen">
  <nav class="nav-glass sticky top-0 z-50 relative">
    <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
      <a href="/" class="flex items-center gap-2.5 group">
        <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-accent-500 to-purple-500 flex items-center justify-center text-white font-black text-sm shadow-lg shadow-accent-500/20 group-hover:shadow-accent-500/40 transition-shadow">N</div>
        <span class="text-lg font-bold tracking-tight text-white">Niludetsu</span>
      </a>
      <div class="flex items-center gap-2 text-sm">
        {% if user is defined and user %}
          <a href="/dashboard" class="px-4 py-2 rounded-xl text-slate-400 hover:text-white hover:bg-white/5 transition-all duration-200 font-medium">Dashboard</a>
          <a href="/me" class="px-4 py-2 rounded-xl text-slate-400 hover:text-white hover:bg-white/5 transition-all duration-200 font-medium">Профіль</a>
          <div class="w-px h-5 bg-white/10 mx-1"></div>
          <div class="flex items-center gap-2.5 px-3 py-1.5 rounded-xl bg-white/[0.03] border border-white/[0.06]">
            {% if user.avatar %}
            <img src="https://cdn.discordapp.com/avatars/{{ user.sub }}/{{ user.avatar }}.png?size=64"
                 class="w-7 h-7 rounded-full ring-2 ring-accent-500/30" alt="">
            {% else %}
            <div class="w-7 h-7 rounded-full bg-accent-500/80 flex items-center justify-center text-xs font-bold text-white">{{ user.username[:1] }}</div>
            {% endif %}
            <span class="text-slate-300 font-medium">{{ user.username }}</span>
          </div>
          <a href="/auth/logout" class="ml-1 px-3 py-2 rounded-xl text-slate-500 hover:text-red-400 hover:bg-red-500/10 transition-all duration-200">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
          </a>
        {% else %}
          <a href="/auth/login" class="btn-accent text-sm !py-2 !px-5 !rounded-xl">Увійти через Discord</a>
        {% endif %}
      </div>
    </div>
  </nav>

  <main class="relative z-10 max-w-7xl mx-auto px-6 py-8">
    {% block content %}{% endblock %}
  </main>

  {% block scripts %}{% endblock %}
</body>
</html>
